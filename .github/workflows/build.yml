name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          flutter create --org com.football.predictor football_app
          cp pubspec.yaml football_app/
          cp main.dart football_app/lib/

      - name: Build APK
        run: |
          cd football_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Football-Predictor-App
          path: football_app/build/app/outputs/flutter-apk/app-release.apk
